<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Fotos - Boda Digital</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./assets/css/custom.css">
</head>
<body>
    <div id="upload" x-data="uploadApp()" x-init="init()">
        <div class="min-h-screen bg-gradient-to-br from-pink-50 to-purple-50 flex items-center justify-center px-4 py-8">
            <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-8">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-serif mb-2" :style="{ color: config?.color_principal || '#e91e63' }">
                        📸 Sube tus Fotos
                    </h1>
                    <p class="text-gray-600">Comparte tus mejores momentos de la boda</p>
                </div>
                
                <!-- Upload Form -->
                <form @submit.prevent="uploadPhoto" class="space-y-6">
                    <!-- Drop Zone -->
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-pink-400 transition-all"
                         @dragover.prevent="dragover = true"
                         @dragleave.prevent="dragover = false"
                         @drop.prevent="handleDrop"
                         :class="dragover ? 'border-pink-400 bg-pink-50' : ''">
                        
                        <div x-show="!file">
                            <p class="text-6xl mb-4">🖼️</p>
                            <p class="text-gray-600">Arrastra una foto aquí o</p>
                            <button type="button" @click="$refs.fileInput.click()"
                                    class="mt-2 px-6 py-2 rounded-lg text-white font-semibold"
                                    :style="{ backgroundColor: config?.color_principal || '#e91e63' }">
                                Seleccionar Foto
                            </button>
                            <input type="file" x-ref="fileInput" accept="image/*" class="hidden" @change="handleFileSelect">
                            <p class="text-sm text-gray-400 mt-2">Formatos: JPG, PNG, GIF (máx. 10MB)</p>
                        </div>
                        
                        <div x-show="file" class="space-y-3">
                            <img :src="previewUrl" alt="Preview" class="max-h-64 mx-auto rounded-lg shadow-md">
                            <p class="font-medium" x-text="file.name"></p>
                            <p class="text-sm text-gray-500" x-text="`${(file.size / 1024 / 1024).toFixed(2)} MB`"></p>
                            <button type="button" @click="clearFile" class="text-red-500 hover:text-red-700 text-sm">
                                ❌ Quitar foto
                            </button>
                        </div>
                    </div>
                    
                    <!-- Photo Details -->
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Título (opcional)</label>
                            <input type="text" x-model="photoData.titulo" placeholder="Ej: La hora del baile"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tu nombre</label>
                            <input type="text" x-model="photoData.nombre" required placeholder="Tu nombre"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
                        </div>
                    </div>
                    
                    <button type="submit"
                            class="w-full py-3 rounded-lg text-white font-semibold transition-all hover:scale-105 disabled:opacity-50"
                            :style="{ backgroundColor: config?.color_principal || '#e91e63' }"
                            :disabled="uploading || !file">
                        <span x-show="!uploading">📤 Subir Foto</span>
                        <span x-show="uploading">⏳ Subiendo...</span>
                    </button>
                    
                    <div x-show="uploadSuccess" class="bg-green-50 text-green-700 p-4 rounded-lg text-center">
                        ✅ ¡Foto subida exitosamente! <a href="/" class="underline font-semibold">Ver álbum</a>
                    </div>
                    
                    <div x-show="uploadError" class="bg-red-50 text-red-700 p-4 rounded-lg text-center" x-text="uploadError"></div>
                </form>
                
                <!-- Gallery Preview -->
                <div class="mt-8 pt-8 border-t">
                    <h2 class="text-xl font-semibold mb-4">📷 Últimas fotos</h2>
                    <div class="grid grid-cols-3 gap-3">
                        <template x-for="(foto, index) in recentPhotos" :key="index">
                            <div class="aspect-square rounded-lg overflow-hidden shadow-sm">
                                <img :src="foto.url" :alt="foto.titulo || 'Foto'" class="w-full h-full object-cover">
                            </div>
                        </template>
                    </div>
                    <p x-show="recentPhotos.length === 0" class="text-gray-400 text-center py-4">
                        Aún no hay fotos. ¡Sé el primero en subir una!
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="./assets/js/supabase-client.js"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/upload.js"></script>
</body>
</html>
